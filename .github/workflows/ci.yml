name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify and audit SECOM dataset
        run: qualityops audit-secom --data-dir data/external/secom/raw > /dev/null

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Compile source
        run: python -m compileall -q src tests powerbi/validation

      - name: Smoke-test CLI
        run: qualityops analyze --values 9 10 11 --lsl 7 --usl 13

      - name: Smoke-test SPC CLI
        run: |
          qualityops spc \
            --file data/spc/qualityops_spc_rbar_n4_v1.csv \
            --columns measure_1 measure_2 measure_3 measure_4 \
            --lsl 495 \
            --usl 505 \
            --target 500 > /dev/null

  postgres-integration:
    name: PostgreSQL 16 / Python 3.13
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Start dedicated PostgreSQL 16 database
        shell: bash
        run: |
          sudo systemctl start postgresql
          server_version="$(sudo -u postgres psql --no-psqlrc --tuples-only --no-align --command 'SHOW server_version_num')"
          if (( server_version < 160000 || server_version >= 170000 )); then
            echo "PostgreSQL 16 is required" >&2
            exit 1
          fi
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          sudo -u postgres psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command "CREATE ROLE qualityops_test_owner LOGIN PASSWORD '$password'"
          sudo -u postgres createdb --owner=qualityops_test_owner qualityops_test_secom
          echo "QUALITYOPS_TEST_OWNER_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "QUALITYOPS_TEST_DATABASE_URL=postgresql://qualityops_test_owner:$password@127.0.0.1:5432/qualityops_test_secom" >> "$GITHUB_ENV"

      - name: Apply Alembic migration
        shell: bash
        run: QUALITYOPS_DATABASE_URL="$QUALITYOPS_TEST_DATABASE_URL" python -m alembic upgrade head

      - name: Create reader, run mandatory PostgreSQL integration, and clean up
        shell: bash
        run: |
          set -Eeuo pipefail
          marker="$RUNNER_TEMP/qualityops_powerbi_reader_created"
          reader_password="$(openssl rand -hex 32)"
          echo "::add-mask::$reader_password"
          export QUALITYOPS_POWERBI_READER_PASSWORD="$reader_password"

          cleanup_reader() {
            local cleanup_status=0
            unset QUALITYOPS_POWERBI_READER_DATABASE_URL
            unset QUALITYOPS_POWERBI_READER_PASSWORD
            if [[ ! -f "$marker" ]]; then
              return 0
            fi
            PGPASSWORD="$QUALITYOPS_TEST_OWNER_PASSWORD" \
              psql --no-psqlrc --set=ON_ERROR_STOP=1 \
                --host=127.0.0.1 --port=5432 \
                --username=qualityops_test_owner --dbname=qualityops_test_secom \
                --set=expected_database=qualityops_test_secom \
                --set=expected_owner=qualityops_test_owner \
                --file=powerbi/postgresql/04_revoke_reader_access.sql \
              || cleanup_status=1
            sudo -u postgres psql --no-psqlrc --set=ON_ERROR_STOP=1 \
              --set=expected_database=qualityops_test_secom \
              --set=expected_owner=qualityops_test_owner \
              --file=powerbi/postgresql/05_drop_reader_role.sql \
              || cleanup_status=1
            if [[ "$cleanup_status" -eq 0 ]]; then
              rm -f "$marker"
            fi
            return "$cleanup_status"
          }

          on_exit() {
            local status=$?
            trap - EXIT
            cleanup_reader || status=1
            exit "$status"
          }
          trap on_exit EXIT

          sudo --preserve-env=QUALITYOPS_POWERBI_READER_PASSWORD -u postgres \
            psql --no-psqlrc --set=ON_ERROR_STOP=1 \
              --set=expected_database=qualityops_test_secom \
              --set=expected_owner=qualityops_test_owner \
              --file=powerbi/postgresql/02_create_reader_role.sql
          touch "$marker"
          sudo -u postgres psql --no-psqlrc --tuples-only --no-align \
            --set=ON_ERROR_STOP=1 \
            --command "SELECT rolpassword LIKE 'SCRAM-SHA-256$%' FROM pg_authid WHERE rolname = 'qualityops_powerbi_reader'" \
            | grep --fixed-strings --line-regexp t > /dev/null

          reader_url="postgresql://qualityops_powerbi_reader:$reader_password@127.0.0.1:5432/qualityops_test_secom"
          echo "::add-mask::$reader_url"
          export QUALITYOPS_POWERBI_READER_DATABASE_URL="$reader_url"
          export QUALITYOPS_RUN_POSTGRES_INTEGRATION=1
          python -m unittest -v tests.test_postgres_integration

      - name: Backstop reader cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          marker="$RUNNER_TEMP/qualityops_powerbi_reader_created"
          if [[ ! -f "$marker" ]]; then
            exit 0
          fi
          role_exists="$(sudo -u postgres psql --no-psqlrc --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'qualityops_powerbi_reader')")"
          if [[ "$role_exists" == "t" ]]; then
            PGPASSWORD="$QUALITYOPS_TEST_OWNER_PASSWORD" \
              psql --no-psqlrc --set=ON_ERROR_STOP=1 \
                --host=127.0.0.1 --port=5432 \
                --username=qualityops_test_owner --dbname=qualityops_test_secom \
                --set=expected_database=qualityops_test_secom \
                --set=expected_owner=qualityops_test_owner \
                --file=powerbi/postgresql/04_revoke_reader_access.sql
            sudo -u postgres psql --no-psqlrc --set=ON_ERROR_STOP=1 \
              --set=expected_database=qualityops_test_secom \
              --set=expected_owner=qualityops_test_owner \
              --file=powerbi/postgresql/05_drop_reader_role.sql
          fi
          rm -f "$marker"

      - name: Confirm reader cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e "$RUNNER_TEMP/qualityops_powerbi_reader_created"
          role_exists="$(sudo -u postgres psql --no-psqlrc --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'qualityops_powerbi_reader')")"
          test "$role_exists" = "f"
