name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify and audit SECOM dataset
        run: qualityops audit-secom --data-dir data/external/secom/raw > /dev/null

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Smoke-test CLI
        run: qualityops analyze --values 9 10 11 --lsl 7 --usl 13

  postgres-integration:
    name: PostgreSQL 16 / Python 3.13
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Start dedicated PostgreSQL 16 database
        shell: bash
        run: |
          sudo systemctl start postgresql
          server_version="$(sudo -u postgres psql --no-psqlrc --tuples-only --no-align --command 'SHOW server_version_num')"
          if (( server_version < 160000 || server_version >= 170000 )); then
            echo "PostgreSQL 16 is required" >&2
            exit 1
          fi
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          sudo -u postgres psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command "CREATE ROLE qualityops_test_owner LOGIN PASSWORD '$password'"
          sudo -u postgres createdb --owner=qualityops_test_owner qualityops_test_secom
          echo "QUALITYOPS_TEST_DATABASE_URL=postgresql://qualityops_test_owner:$password@127.0.0.1:5432/qualityops_test_secom" >> "$GITHUB_ENV"

      - name: Apply Alembic migration
        shell: bash
        run: QUALITYOPS_DATABASE_URL="$QUALITYOPS_TEST_DATABASE_URL" python -m alembic upgrade head

      - name: Run mandatory PostgreSQL integration
        shell: bash
        run: |
          QUALITYOPS_RUN_POSTGRES_INTEGRATION=1 \
          python -m unittest -v tests.test_postgres_integration
